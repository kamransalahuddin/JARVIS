<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS — component reconstruction preview</title><style>*{box-sizing:border-box}body{margin:0;background:#11151b;color:#e9eef5;font:13px system-ui;overflow:hidden}canvas{display:block}aside{position:absolute;top:24px;right:24px;display:grid;gap:8px;width:165px}button,label,select{border:1px solid #3b4550;background:#1b232c;color:#e2e9f0;border-radius:6px;padding:10px;font:12px system-ui;cursor:pointer}label{display:flex;align-items:center;gap:7px}input{accent-color:#84b6bc}#status{position:absolute;left:24px;bottom:24px;color:#aeb9c5}#status:empty{display:none}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><aside><button id="reset">Reset view</button><button id="electronics">Electronics close-up</button><button id="servos">Servo close-up</button><button id="front">Opposite side</button><label><input id="texture" type="checkbox" checked>Surface textures</label><label><input id="wireframe" type="checkbox">Wireframe</label><label><input id="rotate" type="checkbox">Auto rotate</label></aside><div id="status">Loading model…</div><script type="module">
import * as THREE from 'three';import {OrbitControls} from './vendor/OrbitControls.js';import {GLTFLoader} from './vendor/GLTFLoader.js';import {RGBELoader} from './vendor/RGBELoader.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#11151b');const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.001,1000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.09;
scene.add(new THREE.HemisphereLight(0xffffff,0x929bb0,1.8));const key=new THREE.DirectionalLight(0xfff5e4,1.8);key.position.set(.2,.45,.25);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-.3,right:.3,top:.3,bottom:-.3,near:.01,far:2});key.shadow.bias=-.00008;key.shadow.normalBias=.0005;key.shadow.radius=3;scene.add(key);
const fill=new THREE.DirectionalLight(0xc2d9ff,.9);fill.position.set(-.3,.15,-.2);scene.add(fill);
new RGBELoader().load('studio.hdr',texture=>{texture.mapping=THREE.EquirectangularReflectionMapping;scene.environment=texture;});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x10151b,roughness:1,envMapIntensity:.10}));floor.rotation.x=-Math.PI/2;floor.position.y=-.037;floor.receiveShadow=true;// Floating inspection view; no floor occludes the hanging cables.

let model,size,center;const materials=[];
const params=new URLSearchParams(location.search);
new GLTFLoader().load(params.get('model')||'JARVIS.glb',g=>{model=g.scene;scene.add(model);let box=new THREE.Box3().setFromObject(model);center=box.getCenter(new THREE.Vector3());size=box.getSize(new THREE.Vector3()).length();model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;let mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){m.side=THREE.DoubleSide;m.envMapIntensity=.28;materials.push([m,m.map]);}}});reset();document.getElementById('status').textContent='';},undefined,e=>{document.getElementById('status').textContent='Could not load model: '+e.message;console.error(e)});
function reset(){if(!model)return;camera.position.copy(center).add(new THREE.Vector3(.8,.8,1).normalize().multiplyScalar(size*1.42));camera.near=size/1000;camera.far=size*30;camera.updateProjectionMatrix();controls.target.copy(center);controls.update()}
document.getElementById('electronics').onclick=()=>{controls.target.set(0,.013,-.076);camera.position.set(.10,.16,-.16);controls.update()};
document.getElementById('servos').onclick=()=>{controls.target.set(0,.044,.006);camera.position.set(.12,.105,.12);controls.update()};
document.getElementById('reset').onclick=reset;document.getElementById('front').onclick=()=>{camera.position.sub(controls.target).negate().add(controls.target);camera.position.y=controls.target.y+size*.65;controls.update()};
document.getElementById('texture').onchange=e=>{for(const [m,tex] of materials){m.map=e.target.checked?tex:null;m.needsUpdate=true}};document.getElementById('wireframe').onchange=e=>{for(const [m] of materials)m.wireframe=e.target.checked};document.getElementById('rotate').onchange=e=>controls.autoRotate=e.target.checked;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();
</script></body></html>
