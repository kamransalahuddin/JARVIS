<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS — 3D model</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#eef3f9;font:14px system-ui,sans-serif;overflow:hidden}#scene{width:100vw;height:100vh;touch-action:none}header{position:absolute;top:28px;left:32px;pointer-events:none}h1{margin:0;font-size:30px;letter-spacing:.16em;font-weight:650}.eyebrow{color:#8ebbbb;font-size:10px;letter-spacing:.22em;margin-bottom:9px}header p{color:#8f9da9;font-size:12px;margin-top:10px}footer{position:absolute;bottom:25px;left:32px;color:#90a2b0;font-size:12px;line-height:1.8}aside{position:absolute;right:24px;top:28px;display:grid;gap:9px;width:178px}button,label{border:1px solid #34404c;background:#1b242f;color:#dce7ee;border-radius:6px;padding:10px 12px;font:12px system-ui;text-align:left;cursor:pointer}button:hover{background:#2a3846}label{display:flex;align-items:center;gap:8px}input{accent-color:#77bbba}#selected{position:absolute;bottom:28px;right:28px;font-size:12px;color:#c4d8df}#error{position:absolute;left:30px;top:150px;color:#ffac98}canvas{display:block}@media(max-width:600px){header{left:20px;top:20px}aside{top:auto;bottom:80px;right:15px;width:140px}footer{left:20px;font-size:10px}header p{max-width:200px}}
</style></head><body><div id="scene" aria-label="Interactive three dimensional reconstruction of JARVIS. Drag to orbit and scroll to zoom."></div><header><div class="eyebrow">PHOTO-REFERENCED RECONSTRUCTION</div><h1>JARVIS</h1><p>Camera · pan / tilt · wearable controller</p></header><aside><button id="perspective">Perspective</button><button id="top">Top view</button><button id="side">Side view</button><label><input id="wiring" type="checkbox" checked>Show wiring</label><label><input id="wireframe" type="checkbox">Wireframe</label></aside><footer>Drag to orbit · Scroll to zoom · Click to identify a part<br>34 reference photos · Estimated proportions</footer><div id="selected"></div><div id="error"></div>
<script>__THREE__</script><script>
const DATA=__MODEL__;
try {
const el=document.getElementById('scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#10151b');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;el.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,2500);
scene.add(new THREE.HemisphereLight(0xe1f1ff,0x606879,2.4));
for(const [p,c,i] of [[[100,220,180],0xfff4df,3.4],[[-180,120,-120],0x9dc7ff,2.2],[[0,150,-260],0xffffff,2]]){let l=new THREE.DirectionalLight(c,i);l.position.set(...p);scene.add(l)}
const model=new THREE.Group();scene.add(model);const all=[];
for(const m of DATA.meshes){const [color,roughness,metalness]=DATA.materials[m.material];const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(m.positions,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(m.normals,3));const material=new THREE.MeshStandardMaterial({color,roughness,metalness,side:THREE.DoubleSide});const obj=new THREE.Mesh(g,material);obj.name=m.name;model.add(obj);all.push(obj)}
const grid=new THREE.GridHelper(500,25,0x33414d,0x222d38);grid.position.y=-37;scene.add(grid);
let theta=.8,phi=1.02,radius=480;const target=new THREE.Vector3(0,22,0);
function update(){camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);renderer.render(scene,camera)}
function view(t,p){theta=t;phi=p;update()}
document.getElementById('perspective').onclick=()=>view(.8,1.02);document.getElementById('top').onclick=()=>view(0,.001);document.getElementById('side').onclick=()=>view(Math.PI/2,1.44);
document.getElementById('wiring').onchange=e=>{for(const obj of all)if(/wir|cable|connector/i.test(obj.name))obj.visible=e.target.checked;update()};
document.getElementById('wireframe').onchange=e=>{all.forEach(o=>o.material.wireframe=e.target.checked);update()};
let dragging=false,last={x:0,y:0},distance=0;
el.onpointerdown=e=>{dragging=true;distance=0;last={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)};
el.onpointermove=e=>{if(!dragging)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;distance+=Math.abs(dx)+Math.abs(dy);theta-=dx*.006;phi=Math.max(.02,Math.min(Math.PI-.02,phi+dy*.006));last={x:e.clientX,y:e.clientY};update()};
el.onpointerup=e=>{dragging=false;if(distance>4)return;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);const hit=ray.intersectObjects(all.filter(o=>o.visible));document.getElementById('selected').textContent=hit.length?hit[0].object.name:''};
el.onwheel=e=>{e.preventDefault();radius=Math.max(130,Math.min(1000,radius*Math.exp(e.deltaY*.001)));update()};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);update()});
window.jarvis={scene,camera,renderer,model,update,view,meshes:all};update();
}catch(e){document.getElementById('error').textContent='Unable to start the 3D viewer: '+e.message;throw e}
</script></body></html>
